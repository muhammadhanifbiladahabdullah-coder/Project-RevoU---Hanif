<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- ───────────── HEADER / GREETING ───────────── -->
    <header class="header">
      <div class="greeting-block">
        <p id="date-display" class="date-display"></p>
        <h1 id="greeting-text" class="greeting-text"></h1>
        <p id="time-display" class="time-display"></p>
      </div>

      <div class="header-controls">
        <!-- Custom name -->
        <div class="name-form">
          <input
            type="text"
            id="custom-name-input"
            placeholder="Your name…"
            maxlength="30"
            aria-label="Set your name"
          />
          <button id="save-name-btn" aria-label="Save name">Save</button>
        </div>
        <!-- Dark / Light toggle -->
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">
          🌙
        </button>
      </div>
    </header>

    <!-- ───────────── MAIN GRID ───────────── -->
    <main class="grid">

      <!-- ── FOCUS TIMER ── -->
      <section class="card" id="timer-card" aria-label="Focus timer">
        <h2 class="card-title">Focus Timer</h2>

        <!-- Pomodoro duration picker -->
        <div class="timer-settings">
          <label for="pomodoro-duration">Duration (min):</label>
          <input
            type="number"
            id="pomodoro-duration"
            min="1"
            max="120"
            value="25"
            aria-label="Pomodoro duration in minutes"
          />
          <button id="apply-duration-btn">Apply</button>
        </div>

        <div class="timer-display" id="timer-display" aria-live="polite">25:00</div>

        <div class="timer-controls">
          <button id="timer-start" class="btn btn-primary">Start</button>
          <button id="timer-stop" class="btn btn-secondary">Stop</button>
          <button id="timer-reset" class="btn btn-secondary">Reset</button>
        </div>

        <p id="timer-status" class="timer-status" aria-live="polite">Ready</p>
      </section>

      <!-- ── TO-DO LIST ── -->
      <section class="card" id="todo-card" aria-label="To-do list">
        <h2 class="card-title">To-Do List</h2>

        <form id="todo-form" class="todo-form" aria-label="Add task">
          <input
            type="text"
            id="todo-input"
            placeholder="New task…"
            maxlength="120"
            aria-label="Task description"
            required
          />
          <button type="submit" class="btn btn-primary" aria-label="Add task">Add</button>
        </form>

        <!-- Sort controls -->
        <div class="sort-bar">
          <label for="sort-select">Sort:</label>
          <select id="sort-select" aria-label="Sort tasks">
            <option value="default">Default</option>
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
            <option value="done">Done last</option>
            <option value="undone">Done first</option>
          </select>
        </div>

        <ul id="todo-list" class="todo-list" aria-label="Task list"></ul>
        <p id="todo-empty" class="empty-msg">No tasks yet. Add one above!</p>
      </section>

      <!-- ── QUICK LINKS ── -->
      <section class="card" id="links-card" aria-label="Quick links">
        <h2 class="card-title">Quick Links</h2>

        <form id="link-form" class="link-form" aria-label="Add link">
          <input
            type="text"
            id="link-name-input"
            placeholder="Label (e.g. GitHub)"
            maxlength="30"
            aria-label="Link label"
            required
          />
          <input
            type="url"
            id="link-url-input"
            placeholder="https://…"
            aria-label="Link URL"
            required
          />
          <button type="submit" class="btn btn-primary" aria-label="Add link">Add</button>
        </form>

        <div id="links-grid" class="links-grid" aria-label="Saved links"></div>
        <p id="links-empty" class="empty-msg">No links yet. Add one above!</p>
      </section>

    </main>

    <!-- ── EDIT TASK MODAL ── -->
    <div id="edit-modal" class="modal" role="dialog" aria-modal="true" aria-label="Edit task" hidden>
      <div class="modal-box">
        <h3>Edit Task</h3>
        <input
          type="text"
          id="edit-task-input"
          maxlength="120"
          aria-label="Edit task text"
        />
        <div class="modal-actions">
          <button id="edit-save-btn" class="btn btn-primary">Save</button>
          <button id="edit-cancel-btn" class="btn btn-secondary">Cancel</button>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
